name: E1 Kamera - strojenie
version: "0.4.0"
slug: e1_tuner
description: Uczy sie czulosci i obrazu kamery Reolink E1 (pora dnia, pogoda, jasnosc, falszywe alarmy). Wersja 0.1 tylko zbiera dane.
url: https://github.com/VoyteckPL/ha-e1-camera
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
    path: /ha_config
options:
  probkowanie_min: 10
  tryb: zbieranie
schema:
  probkowanie_min: int(2,60)
  tryb: list(zbieranie|proponuj|stosuj)
